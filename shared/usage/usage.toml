# The prices and the estimates usage.py counts with. A model or a provider is added or
# repriced here alone; usage.py refuses a malformed entry, naming it.
#
# A rate is in dollars per million tokens, by kind of token: input, output, cache_read,
# write_5m and write_1h (cache writes by lifetime). A rate other than input may be given as
# { times = n }, a multiple of the input price of the same card. A provider's table holds
# defaults, rates and source, that each of its models takes unless it sets its own. A
# model's tiers are rate cards for a prompt (input, cache reads and writes together) past
# `above` tokens, each taking the provider's multiples of its own input. ids are aliases
# of the model, such as a gateway's or a cloud's ids. A kind of token a call holds without
# a rate leaves the call unpriced, never priced at zero. source is published or fitted (to
# cost-state records), read the date, origin where.

[providers.anthropic]
cache_read = { times = 0.1 }
write_5m = { times = 1.25 }
write_1h = { times = 2.0 }
source = "published"
read = "2026-10-12"
origin = "the claude-api skill of Claude Code 2.1.296, its models table cached 2026-10-06 and its migration guide"

[models]
claude-fable-5-1 = { provider = "anthropic", input = 10.0, output = 50.0, cache_read = 0.25 }
claude-mythos-5-1 = { provider = "anthropic", input = 10.0, output = 50.0, cache_read = 0.25 }
claude-fable-5 = { provider = "anthropic", input = 10.0, output = 50.0 }
claude-opus-5-5 = { provider = "anthropic", input = 4.0, output = 20.0, cache_read = 0.20 }
claude-opus-5 = { provider = "anthropic", input = 5.0, output = 25.0 }
claude-opus-4-8 = { provider = "anthropic", input = 5.0, output = 25.0 }
claude-opus-4-7 = { provider = "anthropic", input = 5.0, output = 25.0 }
claude-opus-4-6 = { provider = "anthropic", input = 5.0, output = 25.0 }
claude-sonnet-5-5 = { provider = "anthropic", input = 2.0, output = 10.0 }
claude-sonnet-5 = { provider = "anthropic", input = 2.0, output = 10.0 }
claude-sonnet-4-6 = { provider = "anthropic", input = 3.0, output = 15.0 }
claude-haiku-5-5 = { provider = "anthropic", input = 0.10, output = 0.50, tiers = [{ above = 100_000, input = 0.50, output = 2.50 }] }
claude-haiku-4-5 = { provider = "anthropic", input = 1.0, output = 5.0 }

# The output of a subagent call whose final usage the transcript lacks.
[estimates.output]
default = { tokens = 5400, measured = "2026-10-06", origin = "the mean over the subagent calls without a final record of roadmap skill-tooling's Phase 3, from the cost-state records of its five sessions, 5,371 tokens (docs/decisions/2026-10-06-token-costs.md)" }
